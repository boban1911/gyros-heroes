<!DOCTYPE html>
<html>
<head>
    <style>
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
            background: #15202b; /* X/Twitter Dimensions & Dark Mode */
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            margin: 0; 
        }
        .tweet-wrapper {
            width: 504px;
            padding: 16px 16px;
            border: 1px solid #38444d;
            border-radius: 12px;
        }
        .user-row {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 12px;
        }
        .avatar {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: #253341;
        }
        .user-info .name {
            color: #fff;
            font-weight: bold;
            font-size: 15px;
        }
        .user-info .handle {
            color: #8899a6;
            font-size: 14px;
        }
        .tweet-text {
            color: #fff;
            font-size: 15px;
            margin-bottom: 12px;
            line-height: 1.4;
        }
        .card { 
            width: 100%; 
            border: 1px solid #38444d; 
            border-radius: 16px; 
            overflow: hidden; 
            cursor: pointer; 
            text-decoration: none; 
            display: block; 
            transition: background 0.2s;
        }
        .card:hover {
            background: rgba(255,255,255,0.03);
        }
        .card img { 
            width: 100%; 
            height: 264px; 
            object-fit: cover; 
            border-bottom: 1px solid #38444d; 
            display: block; 
        }
        .content { 
            padding: 12px 16px; 
            background: transparent; 
        }
        .title { 
            color: #fff; 
            font-size: 15px; 
            margin: 0 0 2px 0; 
            font-weight: bold; 
        }
        .desc { 
            color: #8899a6; 
            font-size: 14px; 
            margin: 0 0 6px 0; 
            display: -webkit-box; border-radius: 12px;
            -webkit-line-clamp: 2; 
            -webkit-box-orient: vertical; 
            overflow: hidden; 
        }
        .domain { 
            color: #8899a6; 
            font-size: 13px; 
            margin-bottom: 0px; 
            display: flex;
            align-items: center;
            gap: 4px;
        }
    </style>
</head>
<body>
    <div class="tweet-wrapper">
        <div class="user-row">
            <div class="avatar"></div>
            <div class="user-info">
                <div class="name">Boban Djordjevic</div>
                <div class="handle">@boban</div>
            </div>
        </div>
        <div class="tweet-text">Check out my new website! 🥙🚀</div>
        
        <a href="#" class="card">
            <img src="./og-image.png" alt="Card Header" />
            <div class="content">
                <h3 class="title">Gyros Heroes</h3>
                <p class="desc">Autentičan grčki ukus u herojskim porcijama! Probajte naš vrhunski gyros, obroke i dodace u Nišu i Novom Sadu.</p>

</html>
